name: Documentation
on:
    push:
      branches:
        - main
      tags: '*'
    pull_request:
jobs:  
  build:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
      # NeuralNetworkParameters is not in the General registry yet, so both environments have to be
      # told where to find it. Remove this, and the `[sources]` entry in Project.toml, once it is
      # registered.
      - name: Add unregistered NeuralNetworkParameters
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add(url="https://github.com/JuliaGNI/NeuralNetworkParameters.jl", rev="main")'
      - name: Configure doc environment
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.add(url="https://github.com/JuliaGNI/NeuralNetworkParameters.jl", rev="main")
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using AbstractNeuralNetworks
            DocMeta.setdocmeta!(AbstractNeuralNetworks, :DocTestSetup, :(using AbstractNeuralNetworks); recursive=true)
            doctest(AbstractNeuralNetworks)'
